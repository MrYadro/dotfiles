name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chezmoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsSL https://chezmoi.io/get)" -- -b "$HOME/.local/bin"

      - name: Fresh-machine apply (localConfigs=false)
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          printf '[data]\nemail = "ci@test.local"\nhostType = "personal"\nopencodeApiKey = "testkey-ci"\nlocalConfigs = false\n' \
            > "$HOME/.config/chezmoi/chezmoi.toml"
          "$HOME/.local/bin/chezmoi" init --apply --exclude=scripts --source "$GITHUB_WORKSPACE"
          "$HOME/.local/bin/chezmoi" --source "$GITHUB_WORKSPACE" managed | grep -Fx '.config/opencode/opencode.json'
          "$HOME/.local/bin/chezmoi" --source "$GITHUB_WORKSPACE" managed | grep -Fx 'Dev/opencode.json'
          jq -e . "$HOME/.config/opencode/opencode.json" "$HOME/Dev/opencode.json" > /dev/null
          jq -e '.providers["zai-coding-plan"].settings.apiKey == "testkey-ci"' "$HOME/.config/opencode/opencode.json" > /dev/null
          jq -e 'has("providers") | not' "$HOME/Dev/opencode.json" > /dev/null
          echo "managed branch OK: files applied, valid JSON, key templated, Dev config slim"

      - name: Local-configs branch (localConfigs=true)
        run: |
          printf '[data]\nemail = "ci@test.local"\nhostType = "personal"\nopencodeApiKey = "testkey-ci"\nlocalConfigs = true\n' \
            > "$HOME/.config/chezmoi/chezmoi.toml"
          if "$HOME/.local/bin/chezmoi" --source "$GITHUB_WORKSPACE" managed \
            | grep -Fx -e '.config/opencode/opencode.json' -e 'Dev/opencode.json'; then
            echo "FAIL: opencode files must be unmanaged when localConfigs=true"
            exit 1
          fi
          echo "localConfigs branch OK: both files skipped"

      - name: Secret scan
        run: |
          if grep -rInE 'sk-[A-Za-z0-9_-]{16,}' --exclude-dir=.git .; then
            echo "FAIL: key-shaped literal found in repo"
            exit 1
          fi
          if grep -rInE '"(apiKey|token|password)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9][A-Za-z0-9_.+/=-]{15,}"' --exclude-dir=.git .; then
            echo "FAIL: credential-shaped literal found in repo"
            exit 1
          fi
          echo "secret scan OK"

  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runs-on: macos-latest
            hostType: personal
          - name: fedora
            runs-on: ubuntu-latest
            container: fedora:latest
            hostType: gaming
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    steps:
      - name: Install git (container)
        if: matrix.container != ''
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install chezmoi
        run: sh -c "$(curl -fsSL https://chezmoi.io/get)" -- -b "$HOME/.local/bin"
      - name: Render and syntax-check all scripts
        run: |
          mkdir -p "$HOME/.config/chezmoi"
          printf '[data]\nemail = "ci@test.local"\nhostType = "%s"\nopencodeApiKey = "testkey-ci"\nlocalConfigs = false\n' "${{ matrix.hostType }}" \
            > "$HOME/.config/chezmoi/chezmoi.toml"
          CH="$HOME/.local/bin/chezmoi"
          "$CH" --source "$GITHUB_WORKSPACE" apply --dry-run
          for s in "$GITHUB_WORKSPACE"/.chezmoiscripts/*.tmpl; do
            "$CH" --source "$GITHUB_WORKSPACE" execute-template < "$s" | bash -n
          done
          echo "all scripts render and pass bash -n (${{ matrix.name }}, ${{ matrix.hostType }})"
      - name: Assert darwin artifacts
        if: runner.os == 'macOS'
        run: |
          CH="$HOME/.local/bin/chezmoi"
          "$CH" --source "$GITHUB_WORKSPACE" cat "$HOME/Brewfile" | grep -Fx 'brew "chezmoi"'
          "$CH" --source "$GITHUB_WORKSPACE" cat "$HOME/Brewfile" | grep -Fx 'cask "ghostty"'
          echo "darwin artifacts OK"
      - name: Assert linux gaming script
        if: runner.os == 'Linux'
        run: |
          CH="$HOME/.local/bin/chezmoi"
          S=$("$CH" --source "$GITHUB_WORKSPACE" execute-template < "$GITHUB_WORKSPACE/.chezmoiscripts/run_onchange_linux-install-packages.sh.tmpl")
          echo "$S" | grep -F 'rpm-ostree install -y "fish" "starship"'
          echo "$S" | grep -F 'flatpak install -y --noninteractive flathub'
          echo "$S" | grep -F '"com.valvesoftware.Steam"'
          echo "linux gaming script OK"
